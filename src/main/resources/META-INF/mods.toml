# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml"
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion = "[47,)"

displayURL = "https://github.com/smokahs/SoL-Pot-Pie"
license = "LGPL-2.1"
credits = "Fork of Spice of Life: Apple Pie Edition, itself descended from the Sweet Potato, Potato, and Carrot Editions."
authors = "smokahs"

[[mods]]
	modId = "solpotpie"
	version = "${file.jarVersion}"
	displayName = "Spice of Life: Pot Pie Edition"
	description = '''
A mod designed to encourage dietary variety!

Every food has a score based on its crafting tree and nutrition. Eating a food for the first time permanently
adds its score to your lifetime points, and every 10 points earns a permanent extra heart. Eating the same
foods over and over restores less and less hunger, so keep your diet varied!
'''

# Dependencies are optional.
[[dependencies]]
	modId = "forge"
	mandatory = true
	versionRange = "[47,)"
	ordering = "NONE" # BEFORE or AFTER required if the relationship is not mandatory
	side = "BOTH" # BOTH, CLIENT or SERVER

[[dependencies]]
	modId = "minecraft"
	mandatory = true
	versionRange = "[1.20.1,)"
	ordering = "NONE"
	side = "BOTH"
